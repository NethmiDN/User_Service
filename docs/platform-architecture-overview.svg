<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Microservice Platform Architecture Overview</title>
  <desc id="desc">GCP External HTTP(S) Load Balancer routes traffic to API Gateway on port 8080, which connects to Config Server on port 8888 and Eureka Server on port 8761.</desc>
  <rect width="1200" height="600" fill="#111111"/>
  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <text x="600" y="58" fill="#ffffff" font-family="Consolas, Menlo, Monaco, monospace" font-size="30" text-anchor="middle">[ GCP External HTTP(S) Load Balancer ]</text>
    <line x1="600" y1="78" x2="600" y2="118"/>
    <polygon points="592,110 608,110 600,124" fill="#ffffff" stroke="none"/>
    <rect x="432" y="126" width="336" height="100" rx="2" ry="2"/>
    <text x="600" y="176" fill="#ffffff" font-family="Consolas, Menlo, Monaco, monospace" font-size="34" text-anchor="middle">API Gateway</text>
    <text x="600" y="212" fill="#ffffff" font-family="Consolas, Menlo, Monaco, monospace" font-size="28" text-anchor="middle">(Port 8080)</text>
    <line x1="600" y1="226" x2="600" y2="286"/>
    <line x1="600" y1="286" x2="242" y2="286"/>
    <line x1="600" y1="286" x2="958" y2="286"/>
    <line x1="242" y1="286" x2="242" y2="326"/>
    <polygon points="234,318 250,318 242,332" fill="#ffffff" stroke="none"/>
    <line x1="958" y1="286" x2="958" y2="326"/>
    <polygon points="950,318 966,318 958,332" fill="#ffffff" stroke="none"/>
    <rect x="56" y="334" width="372" height="112" rx="2" ry="2"/>
    <text x="242" y="386" fill="#ffffff" font-family="Consolas, Menlo, Monaco, monospace" font-size="32" text-anchor="middle">Config Server</text>
    <text x="242" y="422" fill="#ffffff" font-family="Consolas, Menlo, Monaco, monospace" font-size="28" text-anchor="middle">(Port 8888)</text>
    <rect x="772" y="334" width="372" height="112" rx="2" ry="2"/>
    <text x="958" y="386" fill="#ffffff" font-family="Consolas, Menlo, Monaco, monospace" font-size="32" text-anchor="middle">Eureka Server</text>
    <text x="958" y="422" fill="#ffffff" font-family="Consolas, Menlo, Monaco, monospace" font-size="28" text-anchor="middle">(Port 8761)</text>
  </g>
</svg>
